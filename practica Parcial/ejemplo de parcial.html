<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi CV</title>
  <link rel="stylesheet" href="estilos.css">
  <style>
    h1, h2, h3 { color: #336699; }
  </style>
  <script src="validar.js"></script>
</head>
<body>

  <div id="banner">
    <p>Espacio para banner color verde</p>
  </div>

  <div id="contenedor">

    <div id="encabezado">
      <h1>MI CV</h1>
      <div id="redes">
        <span>Enlaces</span>
        <a href="#">Facebook</a>
        <a href="#">Twitter</a>
        <a href="#">LinkedIn</a>
      </div>
    </div>

    <div id="perfil">
      <div id="nombre">
        <h2>Juan Nicolás Perez</h2>
      </div>
      <div id="foto">
        <img src="foto.jpg" alt="Foto de perfil"
             width="200" height="200">
      </div>
      <div id="datos">
        <h3>Datos de contacto</h3>
        <p>Teléfono: 0341-123456</p>
        <p>Ciudad: Rosario</p>
      </div>
    </div>

    <div id="contacto">
      <h3>Contacto</h3>
      <form action="#" method="post"
            onsubmit="return validar()">
        <input type="text" id="nombre_c"
               placeholder="Nombre">
        <input type="email" id="email_c"
               placeholder="Email"><br>
        <input type="text" id="comentario"
               placeholder="Comentario">
        <input type="submit" value="Enviar">
      </form>
    </div>

  </div>

</body>
</html>
